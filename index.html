<script>
const LETTERS = ["A","B","C","D"];
const WK = {1:"الأسبوع 1",2:"الأسبوع 2–4",3:"الأسبوع 2–4",4:"الأسبوع 2–4",5:"الأسبوع 5"};
const CH = {1:"الفصل 1 · Introduction to Data Science",2:"الفصل 2 · Python Tools for Data Science",3:"الفصل 3 · The Facets of Data",4:"الفصل 4 · The Data Science Process",5:"الفصل 5 · Problem Solving with Python"};
const WEEKGROUP = {1:'w1',2:'w1',3:'w2',4:'w5',5:'w5'};

/* ===== QUESTIONS ===== */
const Q = [
/* ---------- Chapter 1 ---------- */
{c:1,q:`Which statement best defines data science?`,o:[`The design of relational databases and their query languages`,`An interdisciplinary field that uses scientific methods, processes, algorithms and systems to extract insight from data and support decisions`,`A branch of pure mathematics concerned with probability theory`,`The practice of building websites that display data`],a:1,e:`Definition in Section 1.1.`},
{c:1,q:`Which three areas overlap to form data science?`,o:[`Computer science, mathematics and statistics, domain knowledge`,`Computer science, marketing, law`,`Statistics, physics, chemistry`,`Programming, graphic design, finance`],a:0,e:`CS gives tools, maths/stats gives methods, domain knowledge gives context.`},
{c:1,q:`Compared with classical statistics, data science places more emphasis on:`,o:[`Formal mathematical proofs`,`Ignoring uncertainty in results`,`Small, carefully designed surveys only`,`Computation, large or unstructured datasets, and building software products`],a:3,e:`Data science borrows statistics' methods but stresses computation, scale and products.`},
{c:1,q:`Which statistician argued in 1962 for the practical analysis of real data and later wrote Exploratory Data Analysis (1977)?`,o:[`Ronald Fisher`,`John Tukey`,`Florence Nightingale`,`John Snow`],a:1,e:`Tukey also introduced the box plot.`},
{c:1,q:`Which 2004 publication led to the open-source Hadoop system and later to Apache Spark?`,o:[`Google's MapReduce paper`,`The Harvard Business Review article on data scientists`,`Tukey's Exploratory Data Analysis`,`The CRISP-DM guide`],a:0,e:`MapReduce ran on clusters of cheap machines; Hadoop and Spark followed.`},
{c:1,q:`In the "Vs" of big data, which one describes the speed at which data arrives?`,o:[`Volume`,`Variety`,`Velocity`,`Value`],a:2,e:`Velocity = speed of arrival.`},
{c:1,q:`The V called veracity refers to:`,o:[`How fast data is produced`,`How much storage the data needs`,`How many different data types exist`,`How trustworthy the data is`],a:3,e:`Veracity = trustworthiness; value = usefulness.`},
{c:1,q:`"Sales fell by 12% last quarter" is an example of which type of analytics?`,o:[`Descriptive`,`Diagnostic`,`Predictive`,`Prescriptive`],a:0,e:`It summarizes what happened.`},
{c:1,q:`"We expect sales to fall a further 5% next quarter unless we act" is an example of:`,o:[`Descriptive analytics`,`Diagnostic analytics`,`Predictive analytics`,`Prescriptive analytics`],a:2,e:`It forecasts what will happen.`},
{c:1,q:`Which type of analytics answers "What should we do?" and typically uses optimization and simulation?`,o:[`Descriptive`,`Diagnostic`,`Predictive`,`Prescriptive`],a:3,e:`Prescriptive recommends an action.`},
{c:1,q:`Which ordering lists the four types of analytics by increasing difficulty and value?`,o:[`Predictive → Descriptive → Prescriptive → Diagnostic`,`Descriptive → Diagnostic → Predictive → Prescriptive`,`Diagnostic → Descriptive → Predictive → Prescriptive`,`Descriptive → Predictive → Diagnostic → Prescriptive`],a:1,e:`Each type builds on the one before it.`},
{c:1,q:`An analyst drills down by region and finds that sales fell mainly where a competitor opened new stores. This is:`,o:[`Descriptive analytics`,`Diagnostic analytics`,`Predictive analytics`,`Prescriptive analytics`],a:1,e:`Drill-down explains why it happened.`},
{c:1,q:`Which role builds and maintains pipelines, data warehouses and data lakes?`,o:[`Data analyst`,`Data engineer`,`BI developer`,`Research scientist`],a:1,e:`Data engineers build the infrastructure that moves and stores data.`},
{c:1,q:`Which role takes models built by data scientists and turns them into reliable, monitored production systems?`,o:[`Machine learning engineer`,`Data analyst`,`Data architect`,`BI developer`],a:0,e:`ML engineers focus on deployment and monitoring.`},
{c:1,q:`Which role mainly answers business questions from existing data using SQL, reports and dashboards?`,o:[`Research scientist`,`Data engineer`,`Data analyst`,`Machine learning engineer`],a:2,e:`Analysts report on existing data.`},
{c:1,q:`Which role designs how an organization's data is modeled, stored, secured and governed?`,o:[`Data architect`,`Data analyst`,`Machine learning engineer`,`BI developer`],a:0,e:`Architects design structure and governance, not individual reports.`},
{c:1,q:`A shop's "customers who bought this also bought…" feature works mainly by:`,o:[`Asking customers to rate every product`,`Choosing products at random`,`Showing the most expensive products first`,`Finding patterns of co-occurrence in millions of purchase records`],a:3,e:`Recommendations rest on co-occurrence in purchase records.`},
{c:1,q:`An airline predicts engine failures from thousands of sensor readings per second. Which two facets of data does this use?`,o:[`Natural language and graph data`,`Images and audio`,`Machine-generated and streaming data`,`Structured survey data and video`],a:2,e:`Sensor readings are machine-generated and arrive as a stream.`},
{c:1,q:`Which of these is a soft skill the chapter says data scientists need?`,o:[`Memorizing every library function`,`Working without input from domain experts`,`Avoiding any discussion of uncertainty`,`Translating a vague business problem into a precise, answerable question`],a:3,e:`Framing the question is a core communication skill.`},
{c:1,q:`A hospital asks two questions: (i) which patients are most likely to be readmitted within 30 days, and (ii) which follow-up call schedule would cut readmissions most within the budget. These are, in order:`,o:[`Descriptive, then diagnostic`,`Diagnostic, then predictive`,`Predictive, then prescriptive`,`Prescriptive, then predictive`],a:2,e:`(i) forecasts a risk; (ii) chooses an action under a constraint.`},

/* ---------- Chapter 2 ---------- */
{c:2,ctx:`Unless stated otherwise, a = np.array([3, 1, 4, 1, 5, 9, 2, 6]), m = np.array([[1, 2, 3], [4, 5, 6]]), and df is the seaborn penguins dataset.`,q:`In a Jupyter notebook, what is the kernel?`,o:[`The file that stores the notebook on disk`,`A markdown cell that explains the code`,`The toolbar at the top of the notebook`,`The Python process that runs your code and remembers variables between cells`],a:3,e:`The kernel keeps variables in memory between cells.`},
{c:2,q:`What should you do before submitting a notebook?`,o:[`Delete all markdown cells`,`Save it as a .py file`,`Run only the last cell`,`Restart the kernel and run all cells from the top`],a:3,e:`Restart and Run All proves the notebook runs top to bottom.`},
{c:2,q:`What does a[2:5] return?`,o:[`[1 4 1]`,`[4 1 5]`,`[4 1 5 9]`,`[1 4 1 5]`],a:1,e:`Positions 2, 3, 4; the end index 5 is excluded.`},
{c:2,q:`What does a[a > 3] return?`,o:[`[True False True ...]`,`[3 4 5 9 6]`,`[4 5 9 6]`,`[9]`],a:2,e:`The mask keeps only values greater than 3.`},
{c:2,q:`What does m.sum(axis=0) return?`,o:[`[6 15]`,`[5 7 9]`,`21`,`[1 4]`],a:1,e:`axis=0 collapses rows: one sum per column (1+4, 2+5, 3+6).`},
{c:2,q:`What is m.shape?`,o:[`(3, 2)`,`(6,)`,`(2, 3)`,`2`],a:2,e:`2 rows, 3 columns.`},
{c:2,q:`What does np.arange(0, 10, 2) return?`,o:[`[0 2 4 6 8]`,`[0 2 4 6 8 10]`,`[2 4 6 8 10]`,`[0. 2.5 5. 7.5 10.]`],a:0,e:`The stop value 10 is excluded.`},
{c:2,q:`An array of shape (2, 3) is multiplied element-wise by another array. Which shape can be broadcast against it?`,o:[`(2,)`,`(3,)`,`(3, 2)`,`(4,)`],a:1,e:`From the right, 3 matches 3 and the missing dimension is stretched.`},
{c:2,q:`Why is temps_c * 9 / 5 + 32 on a NumPy array faster than a Python for loop?`,o:[`It skips some elements`,`It uses less precise numbers`,`It rounds the result`,`It runs the whole operation in compiled code without a Python-level loop`],a:3,e:`Vectorized code avoids the Python loop; about 50× faster at 10 million values.`},
{c:2,q:`Which pandas object is a one-dimensional array with labels?`,o:[`DataFrame`,`ndarray`,`Series`,`Index`],a:2,e:`A Series is one labeled column.`},
{c:2,q:`How many rows do df.loc[0:2] and df.iloc[0:2] return?`,o:[`3 and 2`,`2 and 3`,`2 and 2`,`3 and 3`],a:0,e:`loc includes the end label; iloc excludes the end position.`},
{c:2,q:`Which line correctly selects male penguins heavier than 5500 g?`,o:[`df[df["body_mass_g"] > 5500 and df["sex"] == "Male"]`,`df[(df["body_mass_g"] > 5500) & (df["sex"] == "Male")]`,`df[df["body_mass_g"] > 5500 & df["sex"] == "Male"]`,`df.where("body_mass_g > 5500 and sex = Male")`],a:1,e:`Use & with parentheses; and fails on whole columns.`},
{c:2,q:`Which command shows each column's data type and number of non-null values?`,o:[`df.head()`,`df.describe()`,`df.info()`,`df.shape`],a:2,e:`info() lists dtypes and non-null counts.`},
{c:2,q:`groupby follows which pattern?`,o:[`Map–reduce–sort`,`Filter–join–rank`,`Extract–transform–load`,`Split–apply–combine`],a:3,e:`Split by group, apply a function, combine the results.`},
{c:2,q:`What does df.groupby("species")["body_mass_kg"].mean() return?`,o:[`One overall mean`,`The rows sorted by species`,`One mean per row`,`One mean per species`],a:3,e:`A Series indexed by species.`},
{c:2,q:`What does [g for g in [72, 85, 90, 64, 78] if g >= 70] produce?`,o:[`[72, 85, 90, 78]`,`[64]`,`[True, True, True, False, True]`,`[72, 85, 90, 64, 78]`],a:0,e:`64 fails the condition.`},
{c:2,q:`With the chapter's letter_grade function (90+ A, 80+ B, 70+ C, 60+ D, else F), what is letter_grade(85)?`,o:[`"A"`,`"B"`,`"C"`,`"F"`],a:1,e:`85 is at least 80 but below 90.`},
{c:2,q:`Which Git command records staged changes with a message?`,o:[`git add`,`git push`,`git commit -m "..."`,`git clone`],a:2,e:`add stages; commit records.`},
{c:2,q:`What does git pull do?`,o:[`Downloads your teammates' changes`,`Uploads your commits to GitHub`,`Deletes the local repository`,`Stages a file`],a:0,e:`push uploads; pull downloads.`},
{c:2,q:`Your notebook runs for you, but a TA who runs it from the top gets NameError: name 'clean_df' is not defined. What is the most likely cause?`,o:[`The TA has a different version of Python`,`You defined clean_df in a cell you later deleted, and your kernel still remembered it`,`pandas was not installed on your machine`,`The notebook file is too large`],a:1,e:`Hidden kernel state; the fix is Restart and Run All before sharing.`},

/* ---------- Chapter 3 ---------- */
{c:3,q:`What defines structured data?`,o:[`It follows a fixed schema of named, typed fields that fits rows and columns`,`It is always numeric`,`It is stored only in JSON files`,`It has no organization at all`],a:0,e:`A schema fixes field names and types.`},
{c:3,q:`JSON and XML are typical formats for which kind of data?`,o:[`Structured`,`Streaming`,`Unstructured`,`Semi-structured`],a:3,e:`Tags or keys, but no fixed schema; records may differ.`},
{c:3,q:`A collection of customer reviews written in free text is best described as:`,o:[`Structured data`,`Graph data`,`Natural language, a kind of unstructured data`,`Machine-generated data`],a:2,e:`Human-written text is natural language.`},
{c:3,q:`In what order does the chapter's basic text pipeline run?`,o:[`Tokenization → counting → normalization → stop-word removal`,`Normalization → tokenization → stop-word removal → counting`,`Stop-word removal → normalization → counting → tokenization`,`Counting → tokenization → normalization → stop-word removal`],a:1,e:`Clean the text, split it, drop common words, then count.`},
{c:3,q:`What does stop-word removal remove?`,o:[`Punctuation marks`,`Very common words such as "the" and "and"`,`Words that appear only once`,`Numbers`],a:1,e:`They carry little meaning.`},
{c:3,q:`A web server log line ends with status code 404. What does this mean?`,o:[`Success`,`A server error`,`A client error, such as a missing page`,`A redirect`],a:2,e:`4xx = client error; 5xx = server error; 200 = success.`},
{c:3,q:`Five log lines have status codes 200, 200, 401, 404 and 500. What does (logs["status"] >= 400).mean() print?`,o:[`0.4`,`0.6`,`3`,`0.2`],a:1,e:`401, 404 and 500 are ≥ 400: 3 of 5 = 0.6.`},

/* ===== ENGINE ===== */
const $ = id => document.getElementById(id);
let pending = [], queue = [], pos = 0, roundNo = 1, answered = false;
let totalQ = 0, firstCorrect = 0, liveRight = 0, liveWrong = 0, modeName = 'all';

function show(id){ ["start","quiz","results"].forEach(s => $(s).classList.toggle('hide', s !== id)); }

function pick(m){
  modeName = m;
  const idxs = Q.map((_,i)=>i).filter(i => m==='all' || WEEKGROUP[Q[i].c]===m);
  totalQ = idxs.length;
  pending = idxs.slice();
  firstCorrect = 0; liveRight = 0; liveWrong = 0; roundNo = 1;
  startRound(pending.slice());
}

function startRound(list){ queue = list; pos = 0; show('quiz'); showQ(); }

function showQ(){
  const qi = queue[pos], q = Q[qi];
  answered = false;
  const card = $('qcard');
  card.classList.remove('out','shake');
  card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  $('wk').textContent = WK[q.c];
  $('chap').textContent = CH[q.c];
  $('counter').textContent = roundNo===1 ? `سؤال ${pos+1} من ${queue.length}` : `مراجعة · جولة ${roundNo} · ${pos+1} من ${queue.length}`;
  $('prog').style.width = (pos/queue.length*100) + '%';
  $('liveScore').textContent = liveRight;
  $('liveWrong').textContent = liveWrong;
  $('ctx').innerHTML = q.ctx ? `<div class="ctx">${q.ctx}</div>` : '';
  $('qtext').textContent = q.q;
  $('feed').className = 'feed hide';
  $('nextBtn').classList.add('hide');

  const box = $('opts'); box.innerHTML = '';
  q.o.forEach((txt,i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="k">${LETTERS[i]}</span><span>${txt}</span>`;
    b.onclick = () => choose(i);
    box.appendChild(b);
  });
}

function choose(i){
  if(answered) return;
  answered = true;
  const qi = queue[pos], q = Q[qi];
  const ok = i === q.a;
  const btns = [...document.querySelectorAll('.opt')];
  btns.forEach(b=>b.disabled=true);
  btns[q.a].classList.add('right');
  if(!ok) btns[i].classList.add('wrong');

  if(ok){
    liveRight++;
    pending = pending.filter(x => x!==qi);
    if(roundNo===1) firstCorrect++;
  } else {
    liveWrong++;
    $('qcard').classList.add('shake');
  }

  const feed = $('feed');
  feed.className = 'feed ' + (ok?'ok':'bad');
  feed.innerHTML = `<h3>${ok ? 'إجابة صحيحة 🎉' : 'إجابة غلط 😅 الصح: '+q.o[q.a]}</h3><p>${q.e}</p>`;
  $('liveScore').textContent = liveRight;
  $('liveWrong').textContent = liveWrong;
  $('nextBtn').textContent = pos===queue.length-1 ? 'شوف النتيجة 🏁' : 'السؤال الجاي ←';
  $('nextBtn').classList.remove('hide');
  $('prog').style.width = ((pos+1)/queue.length*100) + '%';
}

function next(){
  if(!answered) return;
  pos++;
  if(pos < queue.length){
    $('qcard').classList.add('out');
    setTimeout(showQ, 280);
  } else {
    endRound();
  }
}

function endRound(){
  const solved = totalQ - pending.length;
  const pct = Math.round(solved/totalQ*100);
  show('results');
  $('firstScore').textContent = `${firstCorrect} / ${totalQ}`;
  $('finalScore').textContent = `${solved} / ${totalQ}`;
  $('pctNum').textContent = pct + '%';
  $('pctSub').textContent = pending.length ? `باقي ${pending.length}` : 'كله صح! ✨';

  let msg, sub;
  if(pending.length===0){ msg='عاش يا بطل! 🔥'; sub='حليت كل الأسئلة صح. انت جاهز.'; }
  else if(pct>=90){ msg='ممتاز جداً 👏'; sub=`فاضل ${pending.length} سؤال بس، راجعهم وخلصهم.`; }
  else if(pct>=70){ msg='شغل محترم 💪'; sub=`راجع الـ ${pending.length} اللي غلطت فيهم وهترتفع النتيجة.`; }
  else if(pct>=50){ msg='كويس، ومحتاج شوية مراجعة'; sub=`راجع الـ ${pending.length} سؤال اللي غلطت فيهم.`; }
  else { msg='محتاج مراجعة، بس ما تقلقش 🙂'; sub=`راجع الأسئلة اللي غلطت فيها وحاول تاني.`; }
  $('msg').textContent = msg;
  $('sub').textContent = sub;

  const rb = $('retryBtn');
  rb.style.display = pending.length ? '' : 'none';
  rb.textContent = `راجع الأسئلة اللي غلطت فيها (${pending.length})`;

  const fg = $('ringFg');
  const C = 490;
  fg.style.strokeDashoffset = C;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ fg.style.strokeDashoffset = C - C*pct/100; }));

  if(pct>=60) confettiBurst();
}

function retry(){ roundNo++; startRound(pending.slice()); }

function home(){
  document.querySelectorAll('.confetti').forEach(n=>n.remove());
  show('start');
}

function confettiBurst(){
  const colors = ['#818cf8','#38bdf8','#22c55e','#f59e0b','#ef4444','#e879f9'];
  for(let i=0;i<70;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colors[i%colors.length];
    c.style.animationDuration = (2.5 + Math.random()*2.5) + 's';
    c.style.animationDelay = (Math.random()*0.8) + 's';
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 6000);
  }
}

document.addEventListener('keydown', e=>{
  if(!$('quiz').classList.contains('hide')){
    if(['1','2','3','4'].includes(e.key) && !answered){
      const n = Number(e.key)-1;
      const q = Q[queue[pos]];
      if(n < q.o.length) choose(n);
    }
    if(e.key==='Enter' && answered) next();
  }
});
</script>
